plugins {
    id 'com.android.application'
}

android {
    namespace 'online.gatewayrevivalglory.tracker'
    compileSdk 35

    defaultConfig {
        applicationId "online.gatewayrevivalglory.tracker"
        minSdk 26          // Android 8.0+
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // The signing key is provided by CI (env vars). It is either the repo
    // secret KEYSTORE_BASE64 (preferred) or a generated, cache-restored key.
    signingConfigs {
        if (System.getenv("KEYSTORE_PASSWORD")) {
            release {
                storeFile file(System.getenv("KEYSTORE_PATH") ?: "${rootDir}/signing.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "grgc-tracker"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
